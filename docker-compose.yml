services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: wms
    ports:
      - "53306:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./docker/mysql/init/database_mysql.sql:/docker-entrypoint-initdb.d/01-database_mysql.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      UPLOAD_LIMIT: 300M
    links:
      - mysql:db
    ports:
      - "50000:80"

  dotnet:
    # dotnet-coverage dynamic instrumentation is only supported on Linux x64.
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__db: MySql
      ConnectionStrings__MySqlConn: Server=mysql;Database=wms;Port=3306;charset=utf8;uid=root;pwd=123456;
      BACKEND_ROOT: /workspace/backend
      BACKEND_ENABLE_COVERAGE: ${BACKEND_ENABLE_COVERAGE:-false}
      BACKEND_COVERAGE_OUTPUT: /workspace/e2e-tests/build/coverage/backend.cobertura.xml
      BACKEND_COVERAGE_REPORT_DIR: /workspace/e2e-tests/build/reports/backend-coverage
    volumes:
      - ./backend:/workspace/backend
      - ./e2e-tests/build:/workspace/e2e-tests/build
      - ${HOME}/.nuget/packages:/root/.nuget/packages
    ports:
      - "10085:5555"

  nginx:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # 当前构建结果默认让前端请求宿主机的 20011 端口
        VITE_BASE_PATH: http://127.0.0.1
        VITE_SERVER_PORT: 20011
    restart: unless-stopped
    depends_on:
      - dotnet
    ports:
      - "58080:80"
